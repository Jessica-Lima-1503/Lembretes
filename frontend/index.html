<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Lembretes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --espresso:#2a1812; --cacau:#4a2e22; --caramelo:#7a5036;
  --ouro:#c9a24b; --ouro-claro:#e6cc8a; --ouro-escuro:#9c7a2c;
  --rosa:#a9566b; --rosa-escuro:#8a4155; --rosa-claro:#e8c9cd;
  --marfim:#fbf5ee; --areia:#efe3d6; --linha:#e2d0bd; --texto:#3a2419; --suave:#8a6f5e;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--texto);min-height:100vh;
  background:radial-gradient(1200px 500px at 85% -10%,rgba(169,86,107,.35),transparent 60%),
             linear-gradient(180deg,var(--espresso),var(--cacau) 420px,#3b2419 100%);
  background-attachment:fixed}
.container{width:92%;max-width:1180px;margin:0 auto;padding:48px 0 60px}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;
  padding-bottom:22px;margin-bottom:28px;border-bottom:1px solid rgba(201,162,75,.45)}
.header h1{font-family:var(--serif);font-size:3rem;font-weight:600;color:var(--ouro-claro);letter-spacing:.5px;line-height:1}
.header p{color:var(--rosa-claro);margin-top:8px;font-size:.98rem;opacity:.85}
.header-actions{display:flex;gap:10px}
.card{background:var(--marfim);border-radius:4px;padding:26px;margin-bottom:22px;
  border-top:3px solid var(--ouro);box-shadow:0 18px 40px rgba(0,0,0,.28)}
.card h2{font-family:var(--serif);font-size:1.7rem;font-weight:600;color:var(--cacau)}
.hidden{display:none!important}
.form-group{display:flex;flex-direction:column;gap:6px;min-width:0}
.form-group label{font-size:.82rem;font-weight:500;color:var(--caramelo);letter-spacing:.3px}
input,select{height:42px;border:1px solid var(--linha);background:#fff;border-radius:3px;padding:0 12px;
  font:inherit;font-size:.95rem;color:var(--texto);width:100%}
input:focus,select:focus,.btn:focus-visible,th.sortable:focus-visible{outline:2px solid var(--ouro);outline-offset:2px;border-color:var(--ouro)}
#formulario h2{margin-bottom:18px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.filtro{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 130px;gap:14px;align-items:end}
.filtro-botoes{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.btn{border:1px solid transparent;border-radius:3px;padding:0 20px;height:42px;cursor:pointer;font:inherit;font-size:.9rem;
  font-weight:500;letter-spacing:.3px;transition:background .2s,color .2s,border-color .2s}
.btn-primary{background:var(--rosa);color:#fff}
.btn-primary:hover{background:var(--rosa-escuro)}
.btn-gold{background:var(--ouro);color:var(--espresso)}
.btn-gold:hover{background:var(--ouro-claro)}
.btn-secondary{background:transparent;color:var(--caramelo);border-color:var(--linha)}
.btn-secondary:hover:not(:disabled){border-color:var(--ouro);color:var(--cacau)}
.header .btn-secondary{color:var(--ouro-claro);border-color:rgba(201,162,75,.6)}
.header .btn-secondary:hover{background:rgba(201,162,75,.15);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-edit{background:transparent;color:var(--ouro-escuro);border-color:var(--ouro)}
.btn-edit:hover{background:var(--ouro);color:var(--espresso)}
.btn-danger{background:transparent;color:var(--rosa-escuro);border-color:var(--rosa-claro)}
.btn-danger:hover{background:var(--rosa);color:#fff;border-color:var(--rosa)}
.actions .btn{height:34px;padding:0 14px;font-size:.82rem}
.table-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
#totalRegistros{color:var(--suave);font-size:.92rem}
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--linha);vertical-align:middle}
th{font-family:var(--serif);font-size:1.1rem;font-weight:700;color:var(--cacau);background:var(--areia);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--rosa-escuro)}
th .seta{display:inline-block;width:14px;color:var(--ouro-escuro)}
tbody tr:hover{background:rgba(201,162,75,.09)}
td.desc{font-weight:500;max-width:380px;overflow-wrap:anywhere}
td.data{color:var(--suave);font-size:.9rem;white-space:nowrap}
.actions{display:flex;gap:6px}
.status{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:600}
.status-ativo{background:#efe2b9;color:#6d5114}
.status-inativo{background:var(--rosa-claro);color:var(--rosa-escuro)}
.empty{text-align:center;padding:42px 20px;color:var(--suave);font-family:var(--serif);font-size:1.3rem}
.pagination{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:22px}
.pagination .btn{height:38px}
#paginaAtual{color:var(--cacau);font-weight:500;min-width:90px;text-align:center}
.toast{position:fixed;right:24px;bottom:24px;background:var(--espresso);color:var(--ouro-claro);
  padding:14px 22px;border-radius:3px;border-left:4px solid var(--ouro);box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:340px;z-index:10}
.toast.erro{border-left-color:var(--rosa);color:var(--rosa-claro)}
@media (max-width:980px){.filtro{grid-template-columns:1fr 1fr}.filtro .form-group:first-child{grid-column:1/-1}}
@media (max-width:700px){
  .header h1{font-size:2.3rem}.filtro{grid-template-columns:1fr}.card{padding:18px}
  table{min-width:760px}.filtro-botoes{justify-content:stretch}.filtro-botoes .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="container">
  <header class="header">
    <div>
      <h1>Meus Lembretes</h1>
      <p>Organize o que não pode ser esquecido</p>
    </div>
    <div class="header-actions">
      <button id="btnImprimir" class="btn btn-secondary">Imprimir relatório</button>
      <button id="btnNovo" class="btn btn-gold">Novo lembrete</button>
    </div>
  </header>

  <!-- FORMULÁRIO -->
  <section id="formulario" class="card hidden">
    <h2 id="tituloFormulario">Novo lembrete</h2>
    <form id="formLembrete">
      <input type="hidden" id="lembreteId">
      <div class="form-group">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" placeholder="Escreva o lembrete" maxlength="500" required>
      </div>
      <div class="form-actions">
        <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar lembrete</button>
      </div>
    </form>
  </section>

  <!-- FILTROS -->
  <section class="card">
    <div class="filtro">
      <div class="form-group"><label for="filtroDescricao">Descrição</label>
        <input type="text" id="filtroDescricao" placeholder="Pesquisar lembretes"></div>
      <div class="form-group"><label for="cadIni">Cadastro a partir de</label>
        <input type="date" id="cadIni"></div>
      <div class="form-group"><label for="cadFim">Cadastro até</label>
        <input type="date" id="cadFim"></div>
      <div class="form-group"><label for="atuIni">Atualização a partir de</label>
        <input type="date" id="atuIni"></div>
      <div class="form-group"><label for="atuFim">Atualização até</label>
        <input type="date" id="atuFim"></div>
      <div class="form-group"><label for="tamanhoPagina">Por página</label>
        <select id="tamanhoPagina">
          <option value="5">5</option><option value="10" selected>10</option><option value="20">20</option>
        </select></div>
    </div>
    <div class="filtro-botoes">
      <button id="btnLimpar" class="btn btn-secondary">Limpar filtros</button>
      <button id="btnFiltrar" class="btn btn-primary">Filtrar</button>
    </div>
  </section>

  <!-- LISTAGEM -->
  <section class="card">
    <div class="table-header">
      <h2>Lembretes</h2>
      <span id="totalRegistros">0 registros</span>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th class="sortable" tabindex="0" data-ordem="Descricao">Descrição<span class="seta"></span></th>
            <th class="sortable" tabindex="0" data-ordem="DataCadastro">Cadastro<span class="seta"></span></th>
            <th class="sortable" tabindex="0" data-ordem="DataAtualizacao">Atualização<span class="seta"></span></th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="listaLembretes"></tbody>
      </table>
      <div id="mensagemVazia" class="empty hidden">Nenhum lembrete encontrado.</div>
    </div>
    <div class="pagination">
      <button id="btnAnterior" class="btn btn-secondary">Anterior</button>
      <span id="paginaAtual">Página 1</span>
      <button id="btnProximo" class="btn btn-secondary">Próxima</button>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
// ========================================
// CONFIGURAÇÃO
// ========================================
// Deve coincidir com o perfil "https" do launchSettings.json da API
const API_URL = "https://localhost:7063";

let paginaAtual = 1;
let ordem = "DataCadastro";
let direcao = "DESC";
let toastTimer;

const $ = id => document.getElementById(id);
const formulario = $("formulario"), formLembrete = $("formLembrete");
const lembreteId = $("lembreteId"), descricao = $("descricao");
const listaLembretes = $("listaLembretes"), mensagemVazia = $("mensagemVazia");
const filtroDescricao = $("filtroDescricao"), tamanhoPagina = $("tamanhoPagina");
const cadIni = $("cadIni"), cadFim = $("cadFim"), atuIni = $("atuIni"), atuFim = $("atuFim");
const totalRegistros = $("totalRegistros"), paginaAtualElemento = $("paginaAtual");
const btnAnterior = $("btnAnterior"), btnProximo = $("btnProximo");
const tituloFormulario = $("tituloFormulario");

// ========================================
// MONTAGEM DOS PARÂMETROS DE FILTRO
// ========================================
// Datas só são enviadas quando preenchidas; a API usa o intervalo completo por padrão.
function montarParametros(numeroPagina, tamanho) {
    const p = new URLSearchParams();
    p.append("NumeroPagina", numeroPagina);
    p.append("TamanhoPagina", tamanho);
    p.append("Descricao", filtroDescricao.value.trim());
    p.append("Ordem", ordem);
    p.append("Direcao", direcao);
    if (cadIni.value) p.append("DataCadastroInicial", cadIni.value);
    if (cadFim.value) p.append("DataCadastroFinal", cadFim.value);
    if (atuIni.value) p.append("DataAtualizacaoInicial", atuIni.value);
    if (atuFim.value) p.append("DataAtualizacaoFinal", atuFim.value);
    return p;
}

// ========================================
// GET /lembretes/filtro
// ========================================
async function filtrarLembretes() {
    try {
        const params = montarParametros(paginaAtual, tamanhoPagina.value);
        const response = await fetch(`${API_URL}/lembretes/filtro?${params}`);
        if (!response.ok) throw new Error(await response.text());

        const r = await response.json();

        // Se a página ficou vazia (ex.: excluiu o último item), volta uma página
        if (r.lembretes.length === 0 && paginaAtual > 1) {
            paginaAtual--;
            return filtrarLembretes();
        }

        renderizarLembretes(r.lembretes);
        totalRegistros.textContent = `${r.total} ${r.total === 1 ? "registro" : "registros"}`;
        paginaAtualElemento.textContent = `Página ${r.numeroPagina}`;
        btnAnterior.disabled = paginaAtual <= 1;
        btnProximo.disabled = paginaAtual * r.tamanhoPagina >= r.total;
        atualizarSetas();
    } catch (error) {
        console.error(error);
        mostrarToast("Não foi possível carregar os lembretes. Verifique se a API está rodando.", true);
    }
}

// ========================================
// GET /lembretes/imprimir  (todos os registros do filtro atual)
// ========================================
async function imprimirLembretes() {
    try {
        const params = montarParametros(1, 1000);
        const response = await fetch(`${API_URL}/lembretes/imprimir?${params}`);
        if (!response.ok) throw new Error(await response.text());

        const url = URL.createObjectURL(await response.blob());
        const a = document.createElement("a");
        a.href = url;
        a.download = "relatorio-lembretes.pdf";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (error) {
        console.error(error);
        mostrarToast("Não foi possível gerar o relatório.", true);
    }
}

// ========================================
// POST /lembretes
// ========================================
async function criarLembrete() {
    try {
        const response = await fetch(`${API_URL}/lembretes`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ descricao: descricao.value.trim() })
        });
        if (!response.ok) throw new Error("Erro ao criar lembrete.");

        mostrarToast("Lembrete criado com sucesso!");
        fecharFormulario();
        paginaAtual = 1;
        await filtrarLembretes();
    } catch (error) {
        console.error(error);
        mostrarToast("Não foi possível criar o lembrete.", true);
    }
}

// ========================================
// GET /lembretes/{id}
// ========================================
async function buscarLembrete(id) {
    try {
        const response = await fetch(`${API_URL}/lembretes/${id}`);
        if (!response.ok) throw new Error("Lembrete não encontrado.");

        const l = await response.json();
        lembreteId.value = l.id;
        descricao.value = l.descricao;
        tituloFormulario.textContent = "Editar lembrete";
        formulario.classList.remove("hidden");
        descricao.focus();
        formulario.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (error) {
        console.error(error);
        mostrarToast("Não foi possível buscar o lembrete.", true);
    }
}

// ========================================
// PUT /lembretes/{id}
// ========================================
async function atualizarLembrete() {
    try {
        const response = await fetch(`${API_URL}/lembretes/${lembreteId.value}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ descricao: descricao.value.trim() })
        });
        if (!response.ok) throw new Error("Erro ao atualizar.");

        mostrarToast("Lembrete atualizado com sucesso!");
        fecharFormulario();
        await filtrarLembretes();
    } catch (error) {
        console.error(error);
        mostrarToast("Não foi possível atualizar o lembrete.", true);
    }
}

// ========================================
// DELETE /lembretes/{id}
// ========================================
async function excluirLembrete(id) {
    if (!confirm("Deseja realmente excluir este lembrete?")) return;
    try {
        const response = await fetch(`${API_URL}/lembretes/${id}`, { method: "DELETE" });
        if (!response.ok) throw new Error("Erro ao excluir.");

        mostrarToast("Lembrete excluído com sucesso!");
        await filtrarLembretes();
    } catch (error) {
        console.error(error);
        mostrarToast("Não foi possível excluir o lembrete.", true);
    }
}

// ========================================
// RENDERIZAÇÃO
// ========================================
function escapar(texto) {
    const d = document.createElement("div");
    d.textContent = texto ?? "";
    return d.innerHTML;
}

function renderizarLembretes(lembretes) {
    listaLembretes.innerHTML = "";
    if (!lembretes || lembretes.length === 0) {
        mensagemVazia.classList.remove("hidden");
        return;
    }
    mensagemVazia.classList.add("hidden");

    lembretes.forEach(l => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="desc">${escapar(l.descricao)}</td>
            <td class="data">${formatarData(l.dataCadastro)}</td>
            <td class="data">${formatarData(l.dataAtualizacao)}</td>
            <td><span class="status ${l.isAtivo ? "status-ativo" : "status-inativo"}">${l.isAtivo ? "Ativo" : "Inativo"}</span></td>
            <td><div class="actions">
                <button class="btn btn-edit" data-acao="editar" data-id="${l.id}">Editar</button>
                <button class="btn btn-danger" data-acao="excluir" data-id="${l.id}">Excluir</button>
            </div></td>`;
        listaLembretes.appendChild(tr);
    });
}

listaLembretes.addEventListener("click", e => {
    const b = e.target.closest("button[data-acao]");
    if (!b) return;
    if (b.dataset.acao === "editar") buscarLembrete(b.dataset.id);
    else excluirLembrete(b.dataset.id);
});

// ========================================
// ORDENAÇÃO (clique no cabeçalho)
// ========================================
function atualizarSetas() {
    document.querySelectorAll("th.sortable").forEach(th => {
        th.querySelector(".seta").textContent =
            th.dataset.ordem === ordem ? (direcao === "ASC" ? "▲" : "▼") : "";
    });
}

function ordenarPor(coluna) {
    if (ordem === coluna) direcao = direcao === "ASC" ? "DESC" : "ASC";
    else { ordem = coluna; direcao = "ASC"; }
    paginaAtual = 1;
    filtrarLembretes();
}

document.querySelectorAll("th.sortable").forEach(th => {
    th.addEventListener("click", () => ordenarPor(th.dataset.ordem));
    th.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ordenarPor(th.dataset.ordem); }
    });
});

// ========================================
// FORMULÁRIO
// ========================================
$("btnImprimir").addEventListener("click", imprimirLembretes);
$("btnNovo").addEventListener("click", abrirFormularioNovo);
$("btnCancelar").addEventListener("click", fecharFormulario);

formLembrete.addEventListener("submit", async event => {
    event.preventDefault();
    if (!descricao.value.trim()) {
        mostrarToast("Informe uma descrição.", true);
        return;
    }
    if (lembreteId.value) await atualizarLembrete();
    else await criarLembrete();
});

function abrirFormularioNovo() {
    lembreteId.value = "";
    descricao.value = "";
    tituloFormulario.textContent = "Novo lembrete";
    formulario.classList.remove("hidden");
    descricao.focus();
}

function fecharFormulario() {
    formulario.classList.add("hidden");
    formLembrete.reset();
    lembreteId.value = "";
}

// ========================================
// FILTRO E PAGINAÇÃO
// ========================================
function intervaloInvalido() {
    return (cadIni.value && cadFim.value && cadIni.value > cadFim.value) ||
           (atuIni.value && atuFim.value && atuIni.value > atuFim.value);
}

function aplicarFiltro() {
    if (intervaloInvalido()) {
        mostrarToast("A data inicial não pode ser maior que a data final.", true);
        return;
    }
    paginaAtual = 1;
    filtrarLembretes();
}

$("btnFiltrar").addEventListener("click", aplicarFiltro);
tamanhoPagina.addEventListener("change", aplicarFiltro);
[filtroDescricao, cadIni, cadFim, atuIni, atuFim].forEach(el =>
    el.addEventListener("keyup", e => { if (e.key === "Enter") aplicarFiltro(); }));

$("btnLimpar").addEventListener("click", () => {
    [filtroDescricao, cadIni, cadFim, atuIni, atuFim].forEach(el => el.value = "");
    aplicarFiltro();
});

btnAnterior.addEventListener("click", () => {
    if (paginaAtual > 1) { paginaAtual--; filtrarLembretes(); }
});
btnProximo.addEventListener("click", () => { paginaAtual++; filtrarLembretes(); });

// ========================================
// UTILITÁRIOS
// ========================================
function formatarData(data) {
    return data ? new Date(data).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "-";
}

function mostrarToast(mensagem, erro = false) {
    const toast = $("toast");
    toast.textContent = mensagem;
    toast.classList.toggle("erro", erro);
    toast.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.add("hidden"), 3500);
}

// ========================================
// INICIALIZAÇÃO
// ========================================
document.addEventListener("DOMContentLoaded", filtrarLembretes);
</script>
</body>
</html>
